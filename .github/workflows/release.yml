name: Release

on:
  push:
    branches: [main]

concurrency:
  # Never two releases at once: a second run could publish a version the first
  # has already claimed.
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_UI: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write # create the release PR and its version commit
      pull-requests: write # open and update the release PR
      id-token: write # npm provenance attestation

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify
        # Publishing an unverified artefact is how a broken release happens.
        # This is the same gate CI runs, repeated here because a release can be
        # triggered by a merge whose CI run predates the version bump.
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm test:package

      - name: Check for npm credentials
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Publish skipped"
              echo
              echo 'No `NPM_TOKEN` secret is set, so there are no credentials to publish with.'
              echo 'Everything up to and including the packed-package verification ran and passed.'
              echo
              echo 'To enable publishing: create an npm automation token with publish rights to'
              echo 'the `@abbainitiative` scope, then add it under **Settings → Secrets and'
              echo 'variables → Actions** as `NPM_TOKEN`.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Skipped rather than failed when the secret is absent. Without this the
      # job dies on an unauthenticated PUT, which the registry answers with a
      # 404 for a scoped package — a misleading error for a missing token.
      # `changeset publish` reads `packageManager` from the root manifest, finds
      # pnpm, and shells out to `pnpm publish` — which rewrites `workspace:*`
      # dependency ranges to real versions as it packs. A plain `npm pack` does
      # not, so a tarball built by hand will show `workspace:*` and look broken.
      # It is not: do not "fix" it by hardcoding versions in the manifests.
      - name: Create a release PR, or publish
        if: steps.npm.outputs.has-token == 'true'
        uses: changesets/action@v1
        with:
          # With pending changesets this opens or updates a release PR. Once
          # that PR is merged there are none left, so this same step publishes.
          version: pnpm run version-packages
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
